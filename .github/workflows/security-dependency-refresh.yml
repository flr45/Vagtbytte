name: One-time security dependency refresh

on:
  push:
    branches: ["agent/predeploy-security-hardening"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[refresh-deps]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/predeploy-security-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve locked dependencies
        run: npm install

      - name: Show resulting production audit
        run: npm audit --omit=dev --audit-level=high || true

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Ingen lockfilændringer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Opdatér låste npm-sikkerhedsafhængigheder"
          git push origin HEAD:agent/predeploy-security-hardening
