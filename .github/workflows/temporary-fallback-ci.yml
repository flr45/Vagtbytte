name: Temporary fallback CI

on:
  push:
    branches:
      - feature/operativ-portal-visual-media

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
      - name: Install dependencies
        working-directory: source
        run: npm ci
      - name: Run unit tests
        working-directory: source
        run: npm test
      - name: Build application
        working-directory: source
        run: npm run build
