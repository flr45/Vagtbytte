name: Temporary fallback CI

on:
  push:
    branches:
      - feature/operativ-portal-visual-media

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
      - name: Install dependencies
        working-directory: source
        run: npm ci
      - name: Run unit tests
        working-directory: source
        run: npm test
      - name: Build application
        working-directory: source
        run: npm run build
      - name: Record successful validation
        working-directory: source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Tests and production build passed at %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > TEMPORARY_CI_SUCCESS.txt
          git add TEMPORARY_CI_SUCCESS.txt
          git commit -m "Record temporary CI success [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"
