name: Temporary v0.6 validation

on:
  push:
    branches:
      - feature/operativ-portal-v0-6

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source

      - name: Validate and record result
        working-directory: source
        run: |
          set +e
          : > validation.log

          npm ci >> validation.log 2>&1
          INSTALL_STATUS=$?

          if [ "$INSTALL_STATUS" -eq 0 ]; then
            npm test >> validation.log 2>&1
            TEST_STATUS=$?
          else
            TEST_STATUS=125
          fi

          if [ "$INSTALL_STATUS" -eq 0 ] && [ "$TEST_STATUS" -eq 0 ]; then
            npm run build >> validation.log 2>&1
            BUILD_STATUS=$?
          else
            BUILD_STATUS=125
          fi

          if [ "$INSTALL_STATUS" -eq 0 ] && [ "$TEST_STATUS" -eq 0 ] && [ "$BUILD_STATUS" -eq 0 ]; then
            RESULT=SUCCESS
          else
            RESULT=FAILED
          fi

          {
            printf 'Result: %s\n' "$RESULT"
            printf 'Time: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'Install: %s\nTest: %s\nBuild: %s\n\n' "$INSTALL_STATUS" "$TEST_STATUS" "$BUILD_STATUS"
            printf '%s\n' '--- Validation log (last 160 lines) ---'
            tail -n 160 validation.log
          } > TEMPORARY_V06_CI_RESULT.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TEMPORARY_V06_CI_RESULT.txt
          git commit -m "Record v0.6 validation result"
          git push origin HEAD:"$GITHUB_REF_NAME"

          if [ "$RESULT" != SUCCESS ]; then
            exit 1
          fi
