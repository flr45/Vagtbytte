<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b70f18" />
  <title>SBR Fire App · Offline</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #070b0e; color: #fff; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); border: 1px solid rgba(255,255,255,.1); border-radius: 20px; background: #0d1317; padding: 28px; box-shadow: 0 24px 70px rgba(0,0,0,.45); }
    .eyebrow { color: #ef4444; font-size: 11px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 10px 0 0; font-size: 30px; line-height: 1.05; }
    p { color: #94a3b8; line-height: 1.6; }
    .status { margin-top: 22px; border-radius: 12px; background: #171d21; padding: 14px; font-weight: 800; }
    a { display: flex; min-height: 48px; margin-top: 18px; align-items: center; justify-content: center; border-radius: 10px; background: #b70f18; color: #fff; text-decoration: none; font-weight: 900; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Slagelse Brand og Redning</div>
    <h1>Du er offline</h1>
    <p>SBR Fire App kan vise køretøjer, rum, udstyr og billeder, som allerede er gemt på denne enhed. Den side du forsøgte at åbne er endnu ikke synkroniseret.</p>
    <div class="status">Forbind til nettet igen og synkronisér offline-indhold fra appens statusmenu.</div>
    <a href="/admin/operativ-portal/">Åbn SBR Fire App</a>
  </main>
</body>
</html>
